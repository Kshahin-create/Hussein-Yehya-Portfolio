kind = "web"
previewPath = "/"
title = "Hussein Yehya Portfolio"
description = "A bilingual personal portfolio for Hussein Yehya, a full-stack web and app developer, showcasing selected software projects with light and dark themes."
version = "1.0.0"
id = "artifacts/hussein-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20641

[services.development]
run = "pnpm --filter @workspace/hussein-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hussein-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/hussein-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20641"
BASE_PATH = "/"
